name: aigateway-experiment

services:
  mysql:
    image: mysql:8.0
    container_name: aigateway-experiment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"
      MYSQL_DATABASE: ai_gateway
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aigateway-experiment-redis
    volumes:
      - redis_data:/data

  fakeprovider:
    image: aigateway-experiment-fakeprovider:e1
    container_name: aigateway-experiment-fakeprovider
    build:
      context: ./fakeprovider
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/__test/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    image: aigateway-experiment-app:e1
    container_name: aigateway-experiment-app
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DSN: "root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=Local"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?ADMIN_API_KEY must be set}"
      REDIS_HOST: "redis:6379"
      ALLOW_INSECURE_PROVIDER_HTTP: "1"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      fakeprovider:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: aigateway_experiment_mysql_data
  redis_data:
    name: aigateway_experiment_redis_data
